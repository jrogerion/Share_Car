<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Sem conexão — ShareCar</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; background: #f7fafc; color: #142333; font: 1rem/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 480px; padding: 28px; background: #fff; border: 1px solid #dce7ed; border-radius: 20px; }
    .brand { color: #0f766e; font-size: 1.2rem; font-weight: 800; }
    h1 { line-height: 1.2; }
    a { display: inline-block; padding: 12px 18px; border-radius: 10px; background: #0f766e; color: white; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #142333; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <span class="brand">ShareCar</span>
    <h1>Sem conexão com o servidor</h1>
    <p>Verifique sua conexão e se a aplicação está em execução. No ambiente local, os containers precisam estar ligados.</p>
    <p>Reservas, pagamentos e vistorias exigem conexão. Nenhuma operação é salva ou reenviada automaticamente por esta tela.</p>
    <a href="{% url 'core:home' %}">Tentar acessar o início</a>
  </main>
</body>
</html>
