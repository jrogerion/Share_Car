{% with page=request.resolver_match.url_name %}
  {% if user.is_authenticated %}
    <div class="navigation-account">
      <a class="{{ link_class }} navigation-profile" href="{% url 'contas:perfil' %}" aria-label="Minha conta: {{ user.first_name|default:'usuário' }}" {% if page == 'perfil' %}aria-current="page"{% endif %}><i class="bi bi-person" aria-hidden="true"></i><span class="navigation-user-name" title="{{ user.first_name|default:'Minha conta' }}">{{ user.first_name|default:"Minha conta" }}</span></a>
      <form method="post" action="{% url 'core:sair' %}" class="nav-logout-form">
        {% csrf_token %}
        <button class="{{ link_class }} nav-logout-button navigation-logout" type="submit" aria-label="Sair da conta"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Sair</button>
      </form>
    </div>
  {% else %}
    <a class="{{ link_class }}" href="{% url 'core:entrar' %}" {% if page == 'entrar' %}aria-current="page"{% endif %}><i class="bi bi-person" aria-hidden="true"></i>Entrar</a>
  {% endif %}
{% endwith %}
