{% if form.errors %}
  <aside class="flow-notice flow-error account-form-errors" role="alert" aria-labelledby="form-errors-title">
    <h3 id="form-errors-title">Confira os dados informados</h3>
    <p>Não foi possível salvar. Revise os campos indicados:</p>
    <ul>
      {% for field in form %}{% if field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}: {{ field.errors|striptags }}</a></li>{% endif %}{% endfor %}
    </ul>
    {{ form.non_field_errors }}
  </aside>
{% endif %}
