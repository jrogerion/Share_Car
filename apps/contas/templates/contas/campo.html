<div class="account-field">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="flow-check account-role-option" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="flow-small account-field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  {{ field.errors }}
</div>
